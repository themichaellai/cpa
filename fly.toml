# fly.toml app configuration file generated for celinespoopapp on 2024-03-21T07:11:41-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'celinespoopapp'
primary_region = 'sjc'

[build]
  [build.args]
    GO_VERSION = '1.26.10'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[http_service.http_options]
  h2_backend = true

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[mounts]
  source="cpa_data"
  destination="/data"
